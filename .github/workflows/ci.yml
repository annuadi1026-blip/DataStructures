name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dsa, POSTGRES_PASSWORD: dsa, POSTGRES_DB: dsa_squad_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dsa" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dsa:dsa@localhost:5432/dsa_squad_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
        env: { VITE_API_URL: https://example.invalid }
