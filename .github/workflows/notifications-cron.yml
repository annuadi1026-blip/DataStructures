# Hourly trigger for the notification processor. Free, and it also wakes a sleeping Render service.
# Add repository secrets: BACKEND_URL (e.g. https://dsa-squad-api.onrender.com) and CRON_SECRET (same value as on Render).
name: Notification job
on:
  schedule: [{ cron: "7 * * * *" }]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the processor (retries cover a cold start)
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST "${{ secrets.BACKEND_URL }}/api/jobs/notifications" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
